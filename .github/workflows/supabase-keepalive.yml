name: Supabase keepalive

on:
  schedule:
    # Uma consulta diaria mantem o projeto ativo no plano Free.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Configure os secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositorio."
            exit 1
          fi

          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/catalog_links?select=id&limit=1")

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Supabase respondeu com HTTP $status."
            exit 1
          fi

          echo "Keepalive concluido (HTTP $status)."
